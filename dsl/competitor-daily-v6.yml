    - data:
        code: "import re\nfrom datetime import timedelta, timezone\nfrom email.utils\
          \ import parsedate_to_datetime\n\nBJ = timezone(timedelta(hours=8))\n\n\n\
          def conv(t):\n    t = (t or \"\").replace(\"\\\\n\", \"\\n\")\n\n    def\
          \ rep(m):\n        try:\n            d = parsedate_to_datetime(m.group(1).strip())\n\
          \            if d.tzinfo is None:\n                d = d.replace(tzinfo=timezone.utc)\n\
          \            bj = d.astimezone(BJ)\n            return f\"**Published Date:**\
          \ {bj:%Y-%m-%d %H:%M}（北京时间）\"\n        except Exception:\n            return\
          \ m.group(0)\n\n    return re.sub(r\"\\*\\*Published Date:\\*\\*\\s*([^\\\
          n]+)\", rep, t)\n\n\ndef main(s: str) -> dict:\n    return {\"t\": conv(s)}"
