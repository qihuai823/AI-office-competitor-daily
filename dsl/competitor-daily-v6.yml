    nodes:
    - data:
        code: "from datetime import datetime, timezone, timedelta\n\ndef main(ts=None)\
          \ -> dict:\n    try:\n        t = float(ts)\n        if t > 1e12:\n    \
          \        t = t / 1000\n        dt = datetime.fromtimestamp(t, timezone.utc)\n\
          \    except (TypeError, ValueError):\n        dt = datetime.now(timezone.utc)\n\
          \    bj = dt.astimezone(timezone(timedelta(hours=8)))\n    return {\"today\"\
