    - data:
        code: "import re, json\nfrom email.utils import parsedate_to_datetime\n\n\
          def main(out, s1: str, s2: str, s3: str) -> dict:\n    data = out if isinstance(out,\
          \ dict) else json.loads(out)\n    dates = {}\n    for s in (s1, s2, s3):\n\
          \        for block in re.split(r'# Result \\d+:', s or ''):\n          \
          \  m_url = re.search(r'\\*\\*URL:\\*\\*\\s*(\\S+)', block)\n           \
          \ m_date = re.search(r'\\*\\*Published Date:\\*\\*\\s*(.+)', block)\n  \
          \          if m_url and m_date:\n                dates[m_url.group(1).strip()]\
          \ = m_date.group(1).strip()\n\n    # 已进 filtered 的条目，从 items 里删掉\n    filtered_titles\
          \ = {str(f.get('title', '')).strip() for f in data.get('filtered', [])}\n\
          \    items = [it for it in data.get('items', [])\n             if str(it.get('title',\
          \ '')).strip() not in filtered_titles]\n\n    for it in items:\n       \
          \ url = it.get('url', '')\n        d = dates.get(url)\n        suspect =\
          \ True\n        if d:\n            try:\n                dt = parsedate_to_datetime(d)\n\
          \                suspect = dt.minute == 0 and dt.second == 0\n         \
          \   except Exception:\n                suspect = True\n        official\
          \ = any(k in url for k in ('weixin.qq.com', 'feishu.cn', 'dingtalk.com'))\n\
          \        if suspect and official:\n            title = it.get('title', '')\n\
          \            if not title.startswith('【日期待核实】'):\n                it['title']\
          \ = '【日期待核实】' + title\n            it['importance'] = min(int(it.get('importance',\
          \ 1)), 2)\n        if it.get('type') == '行业观察':\n            it['importance']\
          \ = min(int(it.get('importance', 1)), 2)\n\n    data['items'] = items\n\
          \    if not items:\n        data['highlights'] = '今日飞书、钉钉、企业微信均无符合标准的新动态。'\n\
          \        data['comparison'] = '无'\n    return {'out2': data}"
