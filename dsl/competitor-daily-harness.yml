    - data:
        code: "import re\nimport json\nfrom datetime import timedelta, timezone\n\
          from email.utils import parsedate_to_datetime\n\nBJ = timezone(timedelta(hours=8))\n\
          \n\ndef norm(u):\n    return (u or '').strip().rstrip('/')\n\n\ndef parse_results(text):\n\
          \    # 从 Tavily 的 text 里取出 {url: Published Date}\n    res = {}\n    for\
          \ block in (text or '').split('# Result ')[1:]:\n        u = re.search(r'\\\
          *\\*URL:\\*\\*\\s*(\\S+)', block)\n        d = re.search(r'\\*\\*Published\
          \ Date:\\*\\*\\s*(.+)', block)\n        if u:\n            res[norm(u.group(1))]\
          \ = d.group(1).strip() if d else ''\n    return res\n\n\ndef main(draft,\
          \ s1: str, s2: str, s3: str, today: str) -> dict:\n    s1 = (s1 or \"\"\
          ).replace(\"\\\\n\",\"\\n\")\n    s2 = (s2 or \"\").replace(\"\\\\n\", \"\
          \\n\")\n    s3 = (s3 or \"\").replace(\"\\\\n\", \"\\n\")\n    if isinstance(draft,\
          \ str):\n        draft = json.loads(draft)\n    src = {}\n    for s in (s1,\
          \ s2, s3):\n        src.update(parse_results(s))\n\n    issues = []\n  \
          \  for it in draft.get('items', []):\n        t = it.get('title', '')\n\
          \        url = norm(it.get('url'))\n        if not url:\n            issues.append(f'《{t}》缺少链接')\n\
          \            continue\n        if not re.sub(r'^https?://[^/]+', '', url).strip('/'):\n\
          \            issues.append(f'《{t}》链接是网站首页')\n        if url not in src:\n\
          \            issues.append(f'《{t}》链接不在原始搜索结果中')\n            continue\n\
          \        raw = src[url]\n        if not raw:\n            issues.append(f'《{t}》搜索结果没有发布日期')\n\
          \            continue\n        dt = parsedate_to_datetime(raw)\n       \
          \ day = dt.astimezone(BJ).strftime('%Y-%m-%d')\n        \n\n    return {'hard_issues':\
          \ '；'.join(issues) if issues else '无'}"
