          \ = {str(f.get('title', '')).strip() for f in data.get('filtered', [])}\n\
          \    items = [it for it in data.get('items', [])\n             if str(it.get('title',\
          \ '')).strip() not in filtered_titles]\n\n    for it in items:\n       \
