          \   return {\"passed\": \"true\", \"issues\": \"无\"}\n    lines = [f\"《{i.get('title',\
          \ '')}》问题：{i.get('problem', '')}；修改：{i.get('fix', '')}\" for i in real]\n\
          \    return {\"passed\": \"false\", \"issues\": \"\\n\".join(lines)}"
