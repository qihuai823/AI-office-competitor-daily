  - description: ''
    id: 7e7c96d1-fb74-4bea-93b5-8e18f8211786
    name: daily_rules
    selector:
    - env
    - daily_rules
    value: '我方是一个 AI 办公产品团队，飞书、钉钉、企业微信都是竞品。以下标准按编号优先，冲突时编号小的优先。

      1. 来源：只用搜索结果里有的事实和链接，发布日期必须等于 today。

      2. 同一事件只留 1 条：同一竞品、同一合作或产品、同一天的多篇报道、评测、解读合并为一条，优先官方来源，其次信息最全的一篇，其他篇的新信息并入 what；其余篇放进
      filtered，reason「同一事件，已合并」。

      3. 主角：竞品是发布方、联合发布方或合作方，且名字出现在标题里，就算主角。只在正文顺带提到、横评、榜单、导购放进 filtered，reason「仅被提及，非主角」。

      4. type：官宣联合、打通、接入写「合作」。当天发布、且没有对应主条的第三方复盘或分析写「行业观察」，即使分析的是往日事件。

      5. importance：5 年度发布会或重大战略；4 官宣联合/打通/接入、大版本、核心 AI；3 联名硬件、新品、重要功能；2 行业观察；1 小活动、小修复。

      6. insight：2 句以内，写对我方产品的启示，落到方向或功能点。不写团队、人名、截止日期、KPI、搜索结果里没有的公司名。

      7. highlights（3 句内，最重要的先说）和 comparison 只写 items 里的内容，不提哪家没有动态。

      8. filtered 的 reason 优先写硬证据：日期不符写「发布日期非今日（原文 YYYY-MM-DD）」。'
    value_type: string
