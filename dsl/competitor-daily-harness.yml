          : {\n        \"must_items\": [\n            {\"url\": \"L92PVD0R\", \"importance_min\"\
          : 3},\n            {\"url\": \"huxiu.com/article/4896760\", \"type\": \"\
          行业观察\", \"importance_min\": 2, \"importance_max\": 2},\n        ],\n   \
          \     \"items_count\": 2,\n        \"must_filtered\": [\"anker-recorder-bean\"\
          , \"aily-repost\"],\n        \"forbid_competitor\": [],\n    },\n    \"\
          2026-11-01\": {  # S1 空结果日\n        \"must_items\": [], \"items_count\"\
          : 0, \"must_filtered\": [], \"forbid_competitor\": [],\n        \"forbid_words\"\
          : [\"importance\"],  # 空日允许写「今日无动态」\n    },\n    \"2026-11-02\": {  # S2\
          \ 年度发布会+同事件\n        \"must_items\": [{\"url\": \"dingtalk-9-launch\", \"\
          importance_min\": 5}],\n        \"items_count\": 1,\n        \"must_filtered\"\
          : [\"dingtalk-9-media\", \"dingtalk-9-analysis\"],\n        \"forbid_competitor\"\
          : [\"飞书\", \"企业微信\"],\n    },\n    \"2026-11-03\": {  # S3 三家同天+横评\n   \
          \     \"must_items\": [\n            {\"url\": \"feishu-base-ai-field\"\
          , \"importance_min\": 3, \"importance_max\": 3},\n            {\"url\":\
          \ \"dingtalk-bank-partner\", \"type\": \"合作\", \"importance_min\": 4},\n\
          \            {\"url\": \"wecom-5015-fix\", \"importance_min\": 1, \"importance_max\"\
          : 2},\n        ],\n        \"items_count\": 3,\n        \"must_filtered\"\
          : [\"office-suite-review\"],\n        \"forbid_competitor\": [],\n    },\n\
          \    \"2026-11-04\": {  # S4 日期边界\n        \"must_items\": [\n         \
          \   {\"url\": \"dingtalk-doc-ai-formula\", \"importance_min\": 3},\n   \
          \         {\"url\": \"wecom-sheet-templates\", \"importance_min\": 2},\n\
          \        ],\n        \"items_count\": 2,\n        \"must_filtered\": [\"\
          www.feishu.cn\", \"wecom-old-news\"],\n        \"forbid_competitor\": [\"\
          飞书\"],\n    },\n}\nFORBID_WORDS = [\"无动态\", \"无符合\", \"无官方动态\", \"没有动态\"\
          , \"importance\"]\n\n\ndef main(out, run_date: str) -> dict:\n    if isinstance(out,\
          \ str):\n        try:\n            out = json.loads(out)\n        except\
          \ Exception:\n            return {\"score\": \"0/0\", \"fails\": \"out 不是合法\
          \ JSON\"}\n    exp = EXPECT.get(run_date)\n    if not exp:\n        return\
          \ {\"score\": \"-\", \"fails\": f\"没有 {run_date} 的期望，跳过打分\"}\n\n    items\
          \ = out.get(\"items\") or []\n    text = (out.get(\"highlights\") or \"\"\
          ) + (out.get(\"comparison\") or \"\")\n    checks = []  # (名称, 是否通过, 说明)\n\
          \n    checks.append((\"条数\", len(items) == exp[\"items_count\"], f\"items\
          \ {len(items)} 条，应为 {exp['items_count']}\"))\n\n    for m in exp[\"must_items\"\
          ]:\n        hit = [i for i in items if m[\"url\"] in (i.get(\"url\") or\
          \ \"\")]\n        if not hit:\n            checks.append((f\"收录 {m['url']}\"\
          , False, \"未收录\"))\n            continue\n        it = hit[0]\n        imp\
          \ = it.get(\"importance\") or 0\n        try:\n            imp = int(imp)\n\
          \        except Exception:\n            imp = 0\n        if \"type\" in\
          \ m:\n            checks.append((f\"{m['url']} type\", it.get(\"type\")\
          \ == m[\"type\"], f\"type={it.get('type')}，应为 {m['type']}\"))\n        ok\
          \ = imp >= m.get(\"importance_min\", 0) and imp <= m.get(\"importance_max\"\
          , 5)\n        checks.append((f\"{m['url']} importance\", ok, f\"importance={imp}\"\
          ))\n\n    for u in exp[\"must_filtered\"]:\n        bad = any(u in (i.get(\"\
          url\") or \"\") for i in items)\n        checks.append((f\"过滤 {u}\", not\
          \ bad, \"仍在 items 中\"))\n\n    for c in exp[\"forbid_competitor\"]:\n  \
          \      bad = any(i.get(\"competitor\") == c for i in items)\n        checks.append((f\"\
          无 {c} 条目\", not bad, f\"items 出现 {c}\"))\n\n    hits = [w for w in exp.get(\"\
          forbid_words\", FORBID_WORDS) if w in text]\n    checks.append((\"highlights/comparison\
          \ 无禁词\", not hits, \"出现：\" + \"、\".join(hits)))\n\n    passed = sum(1 for\
          \ _, ok, _ in checks if ok)\n    fails = [f\"{n}：{why}\" for n, ok, why\
          \ in checks if not ok]\n    return {\"score\": f\"{passed}/{len(checks)}\"\
          , \"fails\": \"；\".join(fails) or \"全部通过\"}"
