            - 竞品官方当天的发布、更新、合作、人事、数据，按普通动态收录。\n- 第三方文章（复盘、评测、分析）只有同时满足两点才收录，type 填「行业观察」，importance\
            \ 不超过 2：\n  a) 发布日期等于今天；\n  b) 该竞品是文章主角：标题或第一段就在讲它，全文主要分析它的产品或策略。\n- 以下情况不收录，放入\
